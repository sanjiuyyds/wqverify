name: build-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== 已安装的 Xcode ==="
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          echo "=== 当前 Xcode ==="
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "wqverify.xcodeproj" \
            -scheme "wqverify" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.example.wqverify" \
            build 2>&1 | tee build.log

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== 编译错误 ==="
          grep -E "error:|warning:" build.log | head -80 || true
          echo ""
          echo "=== 最后 60 行 ==="
          tail -60 build.log || true

      # ★ Xcode 26 的 GENERATE_INFOPLIST_FILE 没有把
      #   INFOPLIST_KEY_UIFileSharingEnabled 写进 Info.plist（实测），
      #   打包前直接补进去，保证 Documents/ 在「文件」App 里可见。
      - name: Patch Info.plist
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: 找不到 .app 产物"
            exit 1
          fi
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST" 2>/dev/null ||             /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST" 2>/dev/null ||             /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          echo "=== Info.plist 文件共享设置 ==="
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST"

      - name: Package into .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: 找不到 .app 产物"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "app = $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry app.ipa Payload
          echo "=== ipa 内容 ==="
          ls -lh app.ipa
          unzip -l app.ipa | head -30

      - name: Verify binary
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          echo "binary = $BIN"
          echo "=== 架构 ==="
          lipo -info "$BIN" || true
          echo "=== 大小 ==="
          ls -l "$BIN"
          echo "=== SHA256 ==="
          shasum -a 256 "$BIN"
          echo "=== 自定义符号 ==="
          nm -a "$BIN" 2>/dev/null | grep -i "writeResult" || echo "(未找到 writeResult)"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
