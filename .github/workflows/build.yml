name: build-ipa

on:
  workflow_dispatch:

env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.wqverify' }}
  APP_GROUP: ${{ vars.APP_GROUP || 'group.com.example.wqverify' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== 已安装的 Xcode ==="
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          echo "=== 当前 Xcode ==="
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "wqverify.xcodeproj" \
            -scheme "wqverify" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            APP_GROUP="$APP_GROUP" \
            build 2>&1 | tee build.log

      # 这个 IPA 是 unsigned 的。要跑 PoC，重签时必须注入一个 App Group：
      # - AltStore / SideStore / Sideloadly 会自动创建；
      # - 企业证书 + profile 需要 profile 里带 App Group。
      # App 会从自己的签名里读实际拿到的 group，不依赖上面这个 APP_GROUP。

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== 编译错误 ==="
          grep -E "error:|warning:" build.log | head -80 || true
          echo ""
          echo "=== 最后 60 行 ==="
          tail -60 build.log || true

      - name: Package into .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: 找不到 .app 产物"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "app = $APP"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "App Group: $(/usr/libexec/PlistBuddy -c 'Print :WQAppGroup' "$APP/Info.plist")"
          echo "File sharing: $(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist")"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry app.ipa Payload
          echo "=== ipa 内容 ==="
          ls -lh app.ipa
          unzip -l app.ipa | head -30

      - name: Verify binary
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          echo "binary = $BIN"
          echo "=== 架构 ==="
          lipo -info "$BIN" || true
          echo "=== 大小 ==="
          ls -l "$BIN"
          echo "=== SHA256 ==="
          shasum -a 256 "$BIN"
          echo "=== PoC 符号 ==="
          nm -a "$BIN" 2>/dev/null | grep -iE "worse_query|wq_diag|container_query" || echo "(未找到 PoC 符号)"
          echo "=== 旧 harness 符号 ==="
          nm -a "$BIN" 2>/dev/null | grep -i "writeResult" || echo "(未找到 writeResult)"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
